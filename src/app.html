<body data-sveltekit-preload-data="hover">
  <!-- Google Tag Manager (noscript) -->

    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-KCD6KHP2"

      style="display:none"
      alt=""
      src="https://www.facebook.com/tr?id=715834075272190&ev=PageView&noscript=1"
    />
  </noscript>
  <!-- End Meta Pixel (noscript) -->

  <div id="modal-root"></div>
  <div style="display: contents">%sveltekit.body%</div>

  <script>
    (() => {
      const revealSelector = [
        '#resumo .section-label',
        '#resumo .section-title',
        '#resumo ol > li',
        '#crm .section-label',
        '#crm h2',
        '#crm .journey-step',
        '#crm .mt-20 > div',
        '#crm .media-frame',
        '#whatsapp .whatsapp-heading > div',
        '#whatsapp .whatsapp-side-inner',
        '#problemas .section-label',
        '#problemas .section-title',
        '#problemas .relative > p',
        '#problemas .relative > .mt-14',
        '#gestao .section-label',
        '#gestao .section-title',
        '#gestao .metric-line',
        '#gestao .responsibility-column',
        '#implantacao .section-label',
        '#implantacao h2',
        '#implantacao .implementation-step',
        '#implantacao .mt-18',
        'footer > div'
      ].join(',');

      const initializeReveal = (root) => {
        if (root.dataset.revealReady === 'true') return;

        const elements = Array.from(root.querySelectorAll(revealSelector));
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        root.dataset.revealReady = 'true';

        elements.forEach((element, index) => {
          element.classList.add('cebrac-reveal');
          element.style.setProperty('--cebrac-reveal-delay', `${(index % 4) * 70}ms`);
        });

        if (reduceMotion || !('IntersectionObserver' in window)) {
          elements.forEach((element) => element.classList.add('is-visible'));
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;

              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            });
          },
          {
            threshold: 0.12,
            rootMargin: '0px 0px -8% 0px'
          }
        );

        requestAnimationFrame(() => {
          elements.forEach((element) => observer.observe(element));
        });
      };

      const scanForPresentation = () => {
        document.querySelectorAll('.presentation-page').forEach(initializeReveal);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scanForPresentation, { once: true });
      } else {
        scanForPresentation();
      }

      new MutationObserver(scanForPresentation).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>
</body>
</html>
