name: Site Quality

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Valores fictícios apenas para compilar módulos legados no CI.
    env:
      DEBUG: "false"
      EXACT_TOKEN: "ci-only"
      EXACT_FUNNEL_ID: "ci-only"
      F10_FONTE: "ci-only"
      F10_UID: "ci-only"
      F10_MIDIA: "ci-only"
      F10_TOKEN: "ci-only"
      F10_URL: "https://example.invalid"
      BREVO_API_KEY: "ci-only"
      BREVO_FROM_EMAIL: "ci@example.invalid"
      BREVO_FROM_NAME: "CI"
      JOBS_MAIL_TO: "ci@example.invalid"
      JOBS_RESUME_MAX_MB: "5"
      SITE_URL: "https://example.invalid"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte and TypeScript checks
        run: npm run check

      - name: Test Brevo email body completeness
        run: |
          node --check scripts/diagnose-brevo-inbound-body.mjs
          node --check scripts/repair-brevo-inbound-body.mjs
          node --experimental-strip-types --test tests/emailInboundBody.test.mjs
          node --experimental-strip-types --test tests/chatMarkdown.test.mjs
          node --experimental-strip-types --test tests/supportChatRestore.test.mjs
          node --experimental-strip-types --test tests/accessPolicies.test.mjs
          node --experimental-strip-types --test tests/nfseRequestStatus.test.mjs
          node --experimental-strip-types --test tests/customerImportFile.test.mjs
          node --experimental-strip-types --test tests/f10CustomerSyncParsing.test.mjs
          node --experimental-strip-types --test tests/f10CustomerCommercialFields.test.mjs
          node --experimental-strip-types --test tests/f10SheetContractMatching.test.mjs

      - name: Build production bundle
        run: npm run build
