name: Site Quality

on:
  push:
    branches:
      - development
      - agent/cebrac-crm-practical-section
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "false"
      EXACT_TOKEN: "ci-placeholder"
      EXACT_FUNNEL_ID: "ci"
      F10_FONTE: "ci"
      F10_UID: "ci"
      F10_MIDIA: "ci"
      F10_TOKEN: "ci-placeholder"
      F10_URL: "https://example.com"
      BREVO_API_KEY: "ci-placeholder"
      BREVO_SALES_MAIL_TO: "ci@example.com"
      BREVO_FROM_EMAIL: "ci@example.com"
      BREVO_FROM_NAME: "CI"
      JOBS_MAIL_TO: "ci@example.com"
      JOBS_RESUME_MAX_MB: "10"
      SITE_URL: "https://example.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte and TypeScript checks
        run: npm run check

      - name: Build production bundle
        run: npm run build
