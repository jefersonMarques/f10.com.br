name: Site Quality

on:
  push:
    branches:
      - development
      - agent/help-review-draft-preserve-assets
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "0"
      EXACT_TOKEN: "ci-placeholder"
      EXACT_FUNNEL_ID: "ci-placeholder"
      F10_FONTE: "ci"
      F10_UID: "ci-placeholder"
      F10_MIDIA: "ci"
      F10_TOKEN: "ci-placeholder"
      F10_URL: "https://example.invalid"
      BREVO_API_KEY: "ci-placeholder"
      BREVO_SALES_MAIL_TO: "ci@example.invalid"
      BREVO_FROM_EMAIL: "ci@example.invalid"
      BREVO_FROM_NAME: "CI"
      JOBS_MAIL_TO: "ci@example.invalid"
      JOBS_RESUME_MAX_MB: "5"
      SITE_URL: "https://example.invalid"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte and TypeScript checks
        run: npm run check

      - name: Build production bundle
        run: npm run build
