name: Site Quality

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte and TypeScript checks
        run: npm run check

      - name: Build production bundle
        run: npm run build
