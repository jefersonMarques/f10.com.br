name: One-time Cebrac WhatsApp layout fix

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/one-time-cebrac-layout-fix.yml

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Move and rebuild WhatsApp section
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path("src/routes/apresentacao/cebrac-crm-whatsapp/+page.svelte")
          css_path = Path("src/cebrac-investment.css")
          workflow_path = Path(".github/workflows/one-time-cebrac-layout-fix.yml")

          page = page_path.read_text(encoding="utf-8")

          # Remove imports and data that belonged only to the old duplicated feature list.
          for import_line in (
              "    BellRing,\n",
              "    MessageCircleMore,\n",
              "    UsersRound,\n",
          ):
              page = page.replace(import_line, "")

          features_start = page.find("  const whatsappFeatures: FeatureItem[] = [")
          features_end = page.find("\n\n  const benefits:", features_start)
          if features_start != -1 and features_end != -1:
              page = page[:features_start] + page[features_end + 2:]

          old_start = page.index('  <section class="model-whatsapp-section')
          benefits_marker = '\n\n  <section id="beneficios"'
          old_end = page.index(benefits_marker, old_start)
          page = page[:old_start] + page[old_end + 2:]

          new_section = '''  <section id="whatsapp" class="model-whatsapp-section scroll-mt-16">
            <div class="whatsapp-container">
              <div class="whatsapp-heading">
                <div class="whatsapp-heading-copy">
                  <p class="whatsapp-kicker">
                    <img src="/icon_whatsapp_color.svg" alt="" aria-hidden="true" />
                    <span>WhatsApp integrado · incluído no upgrade</span>
                  </p>
                  <h2>Cinco números incluídos para conectar o atendimento comercial ao relacionamento com alunos.</h2>
                </div>

                <p class="whatsapp-intro">
                  Cada unidade receberá cinco números de WhatsApp. Durante a implantação, eles serão distribuídos entre o CRM de Leads e o F10 conforme a estrutura de atendimento da unidade.
                </p>
              </div>

              <div class="whatsapp-package">
                <div class="whatsapp-total">
                  <strong>5</strong>
                  <span>números de WhatsApp incluídos por unidade</span>
                </div>

                <div class="whatsapp-channel">
                  <small>No CRM de Leads</small>
                  <strong class="whatsapp-channel-title">Atendimento comercial</strong>
                  <p>Novos leads, negociações e follow-ups ficam vinculados à oportunidade e ao histórico comercial.</p>
                </div>

                <div class="whatsapp-channel">
                  <small>No F10</small>
                  <strong class="whatsapp-channel-title">Relacionamento pós-matrícula</strong>
                  <p>Alunos e responsáveis recebem avisos, orientações, cobranças e demais comunicações da unidade.</p>
                </div>

                <p class="whatsapp-distribution">
                  <strong>Distribuição flexível.</strong> A unidade poderá usar, por exemplo, dois números no CRM e três no F10. A configuração será definida durante a implantação e poderá seguir a necessidade da operação.
                </p>
              </div>

              <div class="whatsapp-meta" aria-label="Condições do WhatsApp integrado">
                <div>
                  <span>Disponibilidade no F10</span>
                  <strong>Agosto de 2026</strong>
                </div>
                <div>
                  <span>Número adicional</span>
                  <strong>R$ 49,00 por número/mês</strong>
                </div>
                <div>
                  <span>Uso dos números adicionais</span>
                  <strong>CRM de Leads ou F10</strong>
                </div>
              </div>
            </div>
          </section>'''

          investment_marker = '  <section id="investimento"'
          investment_index = page.index(investment_marker)
          page = page[:investment_index] + new_section + "\n\n" + page[investment_index:]
          page_path.write_text(page, encoding="utf-8")

          css = css_path.read_text(encoding="utf-8")
          whatsapp_css_start = css.index("/* WhatsApp:")
          investment_css_start = css.index("/* Investimento */")

          whatsapp_css = r'''/* WhatsApp: seção estrutural entre comparação e investimento */
          .page-shell > .model-whatsapp-section {
            width: 100%;
            padding: clamp(5rem, 7vw, 7rem) clamp(1.25rem, 3vw, 3rem) !important;
            border-top: 1px solid rgba(81, 184, 76, 0.28);
            border-bottom: 1px solid rgba(43, 64, 145, 0.12);
            background: #eef8ef !important;
          }

          .page-shell .whatsapp-container {
            width: 100%;
            max-width: 1480px;
            margin-inline: auto;
          }

          .page-shell .whatsapp-heading {
            display: grid;
            grid-template-columns: minmax(0, 0.84fr) minmax(0, 1.16fr);
            gap: clamp(3rem, 7vw, 7rem);
            align-items: end;
            padding-bottom: clamp(2.5rem, 4vw, 4rem);
            border-bottom: 1px solid rgba(43, 64, 145, 0.14);
          }

          .page-shell .whatsapp-kicker {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin: 0 0 1.25rem;
            color: #31983b;
            font-size: 0.72rem;
            font-weight: 850;
            letter-spacing: 0.15em;
            text-transform: uppercase;
          }

          .page-shell .whatsapp-kicker img {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
          }

          .page-shell .whatsapp-heading h2 {
            max-width: 700px;
            margin: 0;
            color: #17356f;
            font-size: clamp(2.45rem, 3.7vw, 4.15rem);
            font-weight: 650;
            letter-spacing: -0.05em;
            line-height: 1.06;
          }

          .page-shell .whatsapp-intro {
            max-width: 760px;
            margin: 0;
            color: rgba(43, 64, 145, 0.72);
            font-size: 1.12rem;
            line-height: 1.95rem;
          }

          .page-shell .whatsapp-package {
            display: grid;
            grid-template-columns: minmax(210px, 0.52fr) minmax(0, 1fr) minmax(0, 1fr);
            margin-top: clamp(2.5rem, 4vw, 4rem);
            border-top: 1px solid rgba(43, 64, 145, 0.14);
            border-bottom: 1px solid rgba(43, 64, 145, 0.14);
            background: #ffffff;
          }

          .page-shell .whatsapp-total {
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 280px;
            padding: clamp(2rem, 3vw, 3rem);
            background: #51b84c;
            color: #ffffff;
          }

          .page-shell .whatsapp-total strong {
            font-size: clamp(5.5rem, 8vw, 8.5rem);
            font-weight: 720;
            letter-spacing: -0.08em;
            line-height: 0.82;
          }

          .page-shell .whatsapp-total span {
            max-width: 210px;
            margin-top: 1.35rem;
            font-size: 0.9rem;
            font-weight: 780;
            line-height: 1.45rem;
            text-transform: uppercase;
          }

          .page-shell .whatsapp-channel {
            min-height: 210px;
            padding: clamp(2rem, 3vw, 3rem);
            border-left: 1px solid rgba(43, 64, 145, 0.1);
          }

          .page-shell .whatsapp-channel small {
            display: block;
            color: #31983b;
            font-size: 0.68rem;
            font-weight: 850;
            letter-spacing: 0.13em;
            text-transform: uppercase;
          }

          .page-shell .whatsapp-channel-title {
            display: block;
            margin-top: 0.7rem;
            color: #17356f;
            font-size: 1.35rem;
            font-weight: 760;
            line-height: 1.4;
          }

          .page-shell .whatsapp-channel p {
            max-width: 440px;
            margin: 0.85rem 0 0;
            color: rgba(43, 64, 145, 0.66);
            font-size: 0.92rem;
            line-height: 1.65rem;
          }

          .page-shell .whatsapp-distribution {
            grid-column: 2 / -1;
            margin: 0;
            padding: 1.35rem clamp(2rem, 3vw, 3rem);
            border-top: 1px solid rgba(43, 64, 145, 0.1);
            border-left: 1px solid rgba(43, 64, 145, 0.1);
            color: rgba(43, 64, 145, 0.68);
            font-size: 0.86rem;
            line-height: 1.55rem;
          }

          .page-shell .whatsapp-distribution strong {
            color: #17356f;
          }

          .page-shell .whatsapp-meta {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            border-bottom: 1px solid rgba(43, 64, 145, 0.14);
          }

          .page-shell .whatsapp-meta > div {
            min-height: 104px;
            padding: 1.45rem 1.6rem;
            border-right: 1px solid rgba(43, 64, 145, 0.1);
          }

          .page-shell .whatsapp-meta > div:last-child {
            border-right: 0;
          }

          .page-shell .whatsapp-meta span,
          .page-shell .whatsapp-meta strong {
            display: block;
          }

          .page-shell .whatsapp-meta span {
            color: rgba(43, 64, 145, 0.5);
            font-size: 0.66rem;
            font-weight: 850;
            letter-spacing: 0.11em;
            text-transform: uppercase;
          }

          .page-shell .whatsapp-meta strong {
            margin-top: 0.45rem;
            color: #17356f;
            font-size: 0.95rem;
            line-height: 1.4rem;
          }

          @media (max-width: 1023px) {
            .page-shell .whatsapp-heading {
              grid-template-columns: minmax(0, 1fr);
              gap: 1.75rem;
              align-items: start;
            }

            .page-shell .whatsapp-package {
              grid-template-columns: minmax(190px, 0.6fr) minmax(0, 1fr);
            }

            .page-shell .whatsapp-total {
              grid-row: 1 / 4;
            }

            .page-shell .whatsapp-channel {
              grid-column: 2;
            }

            .page-shell .whatsapp-channel + .whatsapp-channel {
              border-top: 1px solid rgba(43, 64, 145, 0.1);
            }

            .page-shell .whatsapp-distribution {
              grid-column: 2;
            }
          }

          @media (max-width: 767px) {
            .page-shell > .model-whatsapp-section {
              padding: 4.5rem 1.25rem !important;
            }

            .page-shell .whatsapp-heading h2 {
              font-size: 2.35rem;
            }

            .page-shell .whatsapp-intro {
              font-size: 1rem;
              line-height: 1.75rem;
            }

            .page-shell .whatsapp-package {
              grid-template-columns: minmax(0, 1fr);
            }

            .page-shell .whatsapp-total,
            .page-shell .whatsapp-channel,
            .page-shell .whatsapp-distribution {
              grid-column: 1;
              grid-row: auto;
              border-left: 0;
            }

            .page-shell .whatsapp-total {
              min-height: 220px;
            }

            .page-shell .whatsapp-channel {
              min-height: 0;
              border-top: 1px solid rgba(43, 64, 145, 0.1);
            }

            .page-shell .whatsapp-meta {
              grid-template-columns: minmax(0, 1fr);
            }

            .page-shell .whatsapp-meta > div {
              min-height: 0;
              border-right: 0;
              border-bottom: 1px solid rgba(43, 64, 145, 0.1);
            }

            .page-shell .whatsapp-meta > div:last-child {
              border-bottom: 0;
            }
          }'''

          css = whatsapp_css.strip() + "\n\n" + css[investment_css_start:]
          css_path.write_text(css, encoding="utf-8")

          workflow_path.unlink()
          PY

      - name: Commit structural correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Cebrac WhatsApp section structure and separation"
          git push origin HEAD:development
